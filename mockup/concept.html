<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SimTrust 한눈에 보기</title>
<link rel="stylesheet" href="base.css?v=12">
<style>
/* 발표용 개념 애니메이션. 1280×720 무대 하나를 화면 폭에 맞춰 키우고 줄인다.
   판정 문턱(70%·50%)과 판정 이름은 app/demo_data.py TRUST_RULES·verdict()와 같다. 숫자는 예시. */
body{background:#F5F6F8;padding:20px 0 32px}
.wrap{width:100%;max-width:min(1312px,calc((100vh - 210px) * 16 / 9 + 32px));margin:0 auto;padding:0 16px}
.brand{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.brand .logo{flex:none}
.brand p{font-size:15px;color:var(--g700);line-height:1.5;border-left:1px solid var(--g300);padding-left:14px}
.frame{position:relative;width:100%;aspect-ratio:16/9;background:#fff;border-radius:20px;box-shadow:0 0 0 1px var(--g200);overflow:hidden}
.stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0}
.el{position:absolute;left:0;top:0;transition:transform .9s cubic-bezier(.2,.8,.2,1),opacity .6s ease;will-change:transform}

.cap{width:1150px}
.cap h1{max-width:820px}
.cap .no{font-size:14px;font-weight:700;color:var(--b500)}
.cap h1{font-size:30px;font-weight:700;letter-spacing:-.02em;margin-top:6px;line-height:1.3}
.cap p{font-size:17px;color:var(--g700);margin-top:8px;line-height:1.55}
.ex{right:28px;top:28px;left:auto;font-size:12px;color:var(--g600);background:var(--g100);border-radius:6px;padding:5px 9px}

/* 영역: 위 = AI 페르소나(파랑), 아래 = 실제 대학생 데이터(회색), 오른쪽 아래 = AI 다수결(연파랑) */
.zone{border-radius:20px;transition:transform .9s cubic-bezier(.2,.8,.2,1),opacity .6s ease}
.zone.za{background:#F4F8FF;box-shadow:inset 0 0 0 1.5px var(--b100)}
.zone.zh{background:var(--g100);box-shadow:inset 0 0 0 1.5px var(--g200)}
.zone.zm{background:#F4F8FF;box-shadow:inset 0 0 0 1.5px var(--b100)}
.ztab{width:28px;border-radius:10px;writing-mode:vertical-rl;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;letter-spacing:.08em;text-orientation:upright}
.ztab.a{background:var(--b500)}.ztab.h{background:var(--g800)}
.links line{stroke:var(--g500);stroke-width:1.5;stroke-dasharray:4 4}
/* 서비스 화면 캡처 (실제 캡처 대신 그린 와이어프레임). AI에게 이걸 보여주고 묻는다 */
.shot{width:260px;height:180px;border-radius:14px;background:#fff;box-shadow:0 0 0 1px var(--g200),0 10px 28px rgba(0,0,0,.08);overflow:hidden}
.shot .bar2{height:26px;background:var(--g100);display:flex;align-items:center;gap:5px;padding:0 10px;font-size:11px;font-weight:600;color:var(--g600)}
.shot .bar2 i{width:7px;height:7px;border-radius:50%;background:var(--g300)}
.shot .bar2 span{margin-left:6px}
.shot .bd{padding:12px 14px}
.shot .bd b{display:block;font-size:14px;margin-bottom:8px}
.shot .ln{height:8px;border-radius:4px;background:var(--g100);margin-top:6px}
.shot .hl{display:flex;align-items:center;justify-content:space-between;margin:10px -4px 4px;padding:8px 10px;border-radius:10px;background:var(--b50);box-shadow:0 0 0 2px var(--b500);font-size:12px;font-weight:700;color:var(--b700)}
.shot .hl s{width:30px;height:16px;border-radius:8px;background:var(--b500);position:relative}
.shot .hl s:after{content:"";position:absolute;right:2px;top:2px;width:12px;height:12px;border-radius:50%;background:#fff}
.shotlab{font-size:12px;font-weight:600;color:var(--b700);width:260px;text-align:center}
.look{font-size:12px;font-weight:700;color:var(--b600);width:70px;text-align:center;line-height:1.3}
.look svg{display:block;margin:2px auto 0}
.basket{border-radius:10px 10px 22px 22px;background:repeating-linear-gradient(90deg,rgba(144,194,255,.18) 0 10px,transparent 10px 20px),#fff;box-shadow:inset 0 0 0 2px var(--b200),inset 0 4px 0 var(--b300)}
.btag{height:24px;padding:0 12px;border-radius:12px;background:var(--b500);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;white-space:nowrap}
.btag small{font-weight:500;opacity:.85;margin-left:6px}
.side{width:340px;padding:18px 22px;border-radius:14px;background:var(--g50);font-size:16px;line-height:1.5;color:var(--g700);text-align:center}
.side b{display:block;font-size:18px;color:var(--g900);margin-bottom:4px}

.hu{width:48px;height:48px;border-radius:50%;display:grid;place-items:center}
.ai{width:26px;height:26px;border-radius:50%;background:var(--b50);box-shadow:inset 0 0 0 2px var(--b300);transition:transform .9s cubic-bezier(.2,.8,.2,1),opacity .6s ease,background .3s,box-shadow .3s}
.ai{cursor:pointer}
.ai:hover{box-shadow:inset 0 0 0 2px var(--b600),0 0 0 4px var(--b100)}
.ai.sel{background:var(--b600);box-shadow:0 0 0 5px var(--b100)}
.ai.jo{background:var(--b100);box-shadow:inset 0 0 0 2px var(--b500)}
.ai.talk{background:var(--b500);box-shadow:0 0 0 6px rgba(49,130,246,.2)}
.grp{font-size:14px;font-weight:700;color:var(--g800);width:120px;line-height:1.4}
.grp small{display:block;font-size:12px;font-weight:500;color:var(--g600)}
.grp.l{text-align:right}
.hu{background:var(--g800);color:#fff}
/* 페르소나 카드: 원을 누르면 뜬다 */
.pcard{width:320px;padding:18px 20px;border-radius:16px;background:#fff;box-shadow:0 0 0 1px var(--g200),0 16px 40px rgba(0,0,0,.14);opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
.pcard.on{opacity:1;pointer-events:auto}
.pcard .hd{display:flex;align-items:center;gap:10px}
.pcard .av{width:36px;height:36px;border-radius:50%;background:var(--b50);box-shadow:inset 0 0 0 2px var(--b300);display:grid;place-items:center;font-size:15px;font-weight:800;color:var(--b600)}
.pcard .av.jo{background:var(--b100);box-shadow:inset 0 0 0 2px var(--b500)}
.pcard .nm{font-size:18px;font-weight:800}
.pcard .nm span{font-size:14px;font-weight:500;color:var(--g700);margin-left:6px}
.pcard .x{margin-left:auto;width:28px;height:28px;border:0;border-radius:8px;background:var(--g100);color:var(--g700);font-size:16px;cursor:pointer}
.pcard .tags{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.pcard .tags span{height:24px;padding:0 9px;border-radius:6px;background:var(--g100);font-size:12px;font-weight:600;color:var(--g700);display:inline-flex;align-items:center}
.pcard .tags span.st{background:var(--b50);color:var(--b700)}
.pcard dl{margin-top:12px;font-size:13px;line-height:1.5}
.pcard dt{font-size:12px;font-weight:700;color:var(--g600);margin-top:8px}
.pcard dd{color:var(--g800)}
.hu i{position:absolute;top:54px;left:50%;transform:translateX(-50%);font-style:normal;font-size:12px;font-weight:500;color:var(--g600);white-space:nowrap}

/* 이유 칩: 말한 AI가 많을수록 크고(scale) 진하다(t1~t3). +/− 는 쓸/안 쓸 이유 */
.chip{width:200px;height:34px;border-radius:17px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:600;white-space:nowrap;transition:transform .9s cubic-bezier(.2,.8,.2,1),opacity .6s ease,background .4s,color .4s,box-shadow .4s,outline-color .4s}
.chip em{font-style:normal;font-weight:800}
.chip small{font-size:11px;font-weight:600;opacity:.75}
.t1{background:var(--b50);color:var(--b700)}
.t2{background:var(--b200);color:var(--b700)}
.t3{background:var(--b600);color:#fff}
/* 말풍선: 페르소나가 말하는 순간. 바구니로 가면서 칩으로 바뀐다 */
.chip.bub{background:#fff;color:var(--g900);box-shadow:0 6px 16px rgba(0,0,0,.14),0 0 0 1.5px var(--b200);border-radius:17px 17px 17px 4px}
.chip.pass{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--b500),0 8px 18px rgba(49,130,246,.3)}
.chip.stuck{background:var(--g100);color:var(--g500);text-decoration:line-through}
.chip.cand{background:#fff;color:var(--b700);text-decoration:none;outline:2px dashed var(--b500);outline-offset:-2px}

.sieve{width:896px;height:80px;border-radius:16px;background:repeating-linear-gradient(45deg,var(--g200) 0 2px,transparent 2px 12px),repeating-linear-gradient(-45deg,var(--g200) 0 2px,transparent 2px 12px),var(--g50);box-shadow:inset 0 0 0 2px var(--g300)}
.sieve2{width:220px;background:repeating-linear-gradient(45deg,var(--g300) 0 2px,transparent 2px 22px),repeating-linear-gradient(-45deg,var(--g300) 0 2px,transparent 2px 22px),var(--g50)}
.sieve.shake{animation:shake .5s}
@keyframes shake{25%{margin-top:5px}50%{margin-top:-2px}75%{margin-top:2px}}
.sievelab{font-size:13px;color:var(--g600);line-height:1.4}
.sievelab b{color:var(--g800)}
.candlab{width:220px;text-align:center;font-size:13px;font-weight:700;color:var(--b700)}
.hole{width:136px;height:50px;border-radius:12px;background:#fff;border:1.5px solid var(--g600);display:grid;place-items:center;padding:0 10px;font-size:12px;line-height:1.35;color:var(--g700);text-align:center;transition:transform .9s cubic-bezier(.2,.8,.2,1),opacity .6s ease,border-color .3s,background .3s}
.hole.hit{border:1.5px solid var(--b500);background:var(--b50);color:var(--b700)}
/* AI가 놓친 이유: 사람은 말했는데 AI는 아무도 안 한 말. 파랑·회색 규칙의 유일한 예외(빨강) */
.hole.missed{border:2px dashed #F04452;background:#FFF5F6;color:#D22030;animation:blink 1.1s ease-in-out 3}
@keyframes blink{50%{box-shadow:0 0 0 7px rgba(240,68,82,.18)}}
.miss{font-size:12px;font-weight:700;color:#D22030;width:136px;text-align:center;line-height:1.4}
.miss small{display:block;font-size:11px;font-weight:500}
.meas .t em{font-style:normal;color:#D22030;font-weight:600}

.meas{width:440px;height:110px;border-radius:16px;background:#fff;padding:16px 20px}
.meas .t{display:flex;align-items:center;gap:8px}
.meas .t b{font-size:17px}
.meas .t span{font-size:13px;color:var(--g700)}
.meas .t .verd{margin-left:auto}
.mr{display:grid;grid-template-columns:122px 1fr 46px;align-items:center;gap:10px;margin-top:9px;font-size:12px;color:var(--g700)}
.mr strong{font-size:16px;font-weight:800;color:var(--b600);text-align:right}
.mr.lo strong{color:var(--g600)}
.bar{position:relative;height:10px;border-radius:5px;background:var(--g200)}
.meas.cand{width:220px;background:#fff;outline:2px dashed var(--b300);outline-offset:-2px;font-size:13px;line-height:1.45;color:var(--g700)}
.meas.cand b{display:block;font-size:16px;color:var(--b700);margin-bottom:4px}
.meas.cand small{display:block;margin-top:4px;font-size:12px;color:var(--g600)}
.bar .f{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:5px;background:var(--b500);transition:width 1.2s cubic-bezier(.2,.8,.2,1) .3s}
.bar .th{position:absolute;top:-4px;bottom:-4px;border-left:2px dashed var(--g600)}
.verd{display:inline-flex;height:28px;padding:0 12px;border-radius:15px;align-items:center;font-size:14px;font-weight:700}

/* 신뢰도 지도: 기능 4줄 × (쓸/안 쓸) 2열. 칸은 판정 색으로 채우고(진할수록 믿을 만함) 판정 이름과 % 하나만 둔다.
   근거는 칸을 누르면, 확인할 것(후보·놓친 이유)은 펼치기 버튼을 누르면 나온다 */
.cell{border-radius:14px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--g200);padding:12px 16px}
.cell.vc{display:flex;flex-direction:column;justify-content:center;padding:0 22px;cursor:pointer}
.vc .vr{display:flex;align-items:baseline;justify-content:space-between}
.vc .vn{font-size:18px;font-weight:700}
.vc .vp{font-size:19px;font-weight:800;white-space:nowrap}
.vc .vp small{font-size:13px;font-weight:600;opacity:.7;margin:0 3px}
.vc .det{font-size:12px;opacity:.85;max-height:0;overflow:hidden;transition:max-height .3s,margin .3s}
.vc.open .det{max-height:20px;margin-top:4px}
.cell.fc{background:var(--g50);box-shadow:none;display:flex;flex-direction:column;justify-content:center;font-size:17px;font-weight:700}
.cell.fc.now{box-shadow:inset 0 0 0 2px var(--b500)}
.cell.fc small{font-size:12px;font-weight:600;color:var(--b600)}
.mbtn{width:250px;height:32px;border-radius:16px;border:0;display:flex;align-items:center;justify-content:center;background:var(--g800);color:#fff;font:inherit;font-size:13px;font-weight:700;cursor:pointer;transition:transform .6s cubic-bezier(.2,.8,.2,1),opacity .6s ease,background .2s}
.mbtn:hover{background:var(--g900)}
.cell.lc{display:flex;flex-wrap:wrap;gap:6px;align-content:center;padding:8px 12px}
.lc .none{font-size:13px;color:var(--g400);padding-left:4px}
.pc{height:26px;padding:0 10px;border-radius:13px;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.pc small{font-weight:500;opacity:.75}
.pc.c{color:var(--b700);background:#fff;outline:1.5px dashed var(--b500);outline-offset:-1.5px}
.pc.m{color:#D22030;background:#FFF5F6;outline:1.5px dashed #F04452;outline-offset:-1.5px}
.mh{font-size:14px;font-weight:700;color:var(--g700);white-space:nowrap}
.mh small{font-size:12px;font-weight:500;color:var(--g500);margin-left:4px}
.legend .pc{height:20px;font-size:11px}
.mnote{font-size:13px;color:var(--g600)}
.legend{font-size:13px;color:var(--g700);display:flex;gap:16px;align-items:center}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
/* 판정 4단계 색 (base.css --v-*). 진한 파랑일수록 믿을 만함 */
.v-trust{background:var(--v-trust);color:#fff}.v-ref{background:var(--v-ref);color:var(--b700)}
.v-ask{background:var(--v-ask);color:#fff}.v-none{background:var(--v-none);color:var(--g600)}

.ctrl{display:flex;align-items:center;gap:10px;margin-top:16px;flex-wrap:wrap}
.ctrl button{height:40px;padding:0 16px;border-radius:10px;border:0;background:var(--g100);color:var(--g800);font:inherit;font-size:15px;font-weight:600;cursor:pointer}
.ctrl button.pri{background:var(--b500);color:#fff}
.ctrl button:disabled{opacity:.4;cursor:default}
.dots{display:flex;gap:6px;flex:1;justify-content:center;flex-wrap:wrap}
.dots button{height:32px;padding:0 12px;font-size:13px;font-weight:500;background:transparent;color:var(--g600)}
.dots button.on{background:var(--b50);color:var(--b700);font-weight:700}
.hint{font-size:13px;color:var(--g600);margin-top:10px;text-align:center}
@media (prefers-reduced-motion:reduce){.el,.chip,.hole,.bar .f{transition-duration:0s!important;transition-delay:0s!important}.sieve.shake{animation:none}}
</style></head>
<body>
<div class="wrap">
  <div class="brand"><div class="logo"><i></i>SimTrust</div><p>대학생 공고·취업 서비스의 기능마다 AI 가상 사용자가 말하는 쓸 이유와 안 쓸 이유가 실제 대학생 응답과 얼마나 맞는지 재서, 어떤 이유를 믿어도 되는지 판정해 주는 오픈소스 도구</p></div>
  <div class="frame" id="frame"><div class="stage" id="stage"></div></div>
  <div class="ctrl">
    <button id="prev">이전</button>
    <div class="dots" id="dots"></div>
    <button id="auto">자동 재생</button>
    <button id="next" class="pri">다음</button>
  </div>
  <div class="hint">← → 또는 스페이스로 넘겨요 · 숫자는 예시예요</div>
</div>
<script>
const W = 1280, H = 720;
const STEPS = [
  {dot: "질문", h: "대학생 서비스, 기능마다 쓸 이유와 안 쓸 이유가 궁금해요",
   p: "실제 대학생에게 물으면 몇 주, AI 가상 사용자에게 화면 캡처를 보여 주면 몇 분이에요. 그런데 그 말을 믿어도 될까요?"},
  {dot: "AI 가상 사용자", h: "AI 가상 사용자 30명이 화면 캡처를 보고 의견을 내요",
   p: "위쪽은 AI 영역이에요. 기능마다 쓸 이유와 안 쓸 이유를 말하면 아래에 모이고, 같은 말이 많을수록 칩이 커요."},
  {dot: "실제 대학생", h: "아래쪽은 실제 대학생 데이터예요",
   p: "실제 대학생 6명의 응답으로 거름망 구멍을 만들어요. 구멍 하나가 사람이 한 말 하나예요."},
  {dot: "거름망", h: "AI 의견을 아래 거름망에 부어요",
   p: "사람도 한 말만 ① 구멍을 통과해요. 걸린 말 중 AI 10명 이상이 말한 큰 칩은 ② 다수결 망에 남아요."},
  {dot: "판정", h: "두 가지 비율을 재서 판정해요",
   p: "AI 말이 맞은 비율(정밀도)과 사람 말을 맞힌 비율(재현율)이 둘 다 70% 넘으면 믿고 써도 됨, 둘 다 50% 넘으면 참고용이에요."},
  {dot: "신뢰도 지도", h: "AI가 말한 쓸 이유는 기능 4개 중 2개에서 믿고 써도 돼요",
   p: "기능마다 거름망을 돌리면 이 신뢰도 지도가 나와요. 믿을 칸은 바로 쓰고, 후보는 사람에게 확인해요."},
];

// 무대 좌표 (px). AI 영역(캡처 · 페르소나 · 의견 바구니) → 거름망 → 통과한 이유 → 사람 / 측정판
// experiments/personas_nemotron_korea/personas/ 의 30명 (재학생 15 → 취준생 15, manifest.json 순서)
// n 이름, a 나이, g 성별, r 지역, job 취준생 여부, goal 진로 목표 첫 문장, likes 좋아하는 것 3개. 전공은 원본 데이터에 없다

      put(el, aiX(from), aiY(from), {s: .2, o: 0});
      later(1300 + i * 520, () => { c.by.forEach(k => ais[k].classList.add("talk")); el.classList.add("bub"); put(el, bx, by, {s: sz * .92}); });
      later(1750 + i * 520, () => c.by.forEach(k => ais[k].classList.remove("talk")));
      later(2300 + i * 520, () => { el.classList.remove("bub"); put(el, rx, ry, {s: sz}); });
      return;
    }
    if (step === 2) return put(el, rx, ry, {s: sz});
    const passed = c.hole !== null, many = c.n >= MANY, k = stuckOrder.indexOf(c);
    const pass = () => { el.classList.add("pass"); holes[c.hole].classList.add("hit"); };
    if (step === 3) {
      put(el, rx, ry, {s: sz});
      if (passed) {   // ① 구멍 위로 → 아래로 빠짐
        later(300 + i * 120, () => put(el, HOLE_X[c.hole], REST_Y, {s: sm}));
        later(1500 + i * 120, () => { put(el, HOLE_X[c.hole], passY(c.hole), {s: sm}); pass(); });
      } else {        // ① 망에 걸림 → ② 거름망으로 → 작은 칩은 빠져서 사라지고 큰 칩만 남음
        later(2700 + i * 120, () => { put(el, c.gap, REST_Y, {s: sm}); el.classList.add("stuck"); });
        later(3300, () => sieve.classList.add("shake"));
        later(4300 + k * 800, () => put(el, S2X, REST_Y, {s: sm}));
        later(5000 + k * 800, () => many
          ? (el.classList.replace("stuck", "cand"), sieve2.classList.add("shake"))
          : put(el, S2X, 570, {s: sm * .8, o: 0}));
      }
      return;
    }
    if (passed) { put(el, HOLE_X[c.hole], passY(c.hole), {s: sm}); pass(); }
    else if (many) { put(el, S2X, REST_Y, {s: sm}); el.classList.add("cand"); }
    else put(el, S2X, 570, {s: sm * .8, o: 0});
  });
  // 아무 칩도 통과하지 않은 구멍 = AI가 놓친 이유. 통과가 끝난 뒤 빨갛게 깜빡인다
  const missed = HOLES.map((_, h) => !CHIPS.some(c => c.hole === h)), mi = missed.indexOf(true);
  const markMissed = () => { holes.forEach((el, h) => missed[h] && el.classList.add("missed")); put(miss, HOLE_X[mi], passY(0) + 6); };
  put(miss, HOLE_X[mi], passY(0) + 6, {o: 0});
  if (step === 3) later(2600, markMissed);
  if (step === 4) markMissed();

  // 측정판
  meas.forEach((el, k) => {
    const fs = el.querySelectorAll(".f");
    if (last && prev === 4) {   // 판정 카드가 줄어들며 지도 첫 줄 칸으로 날아 들어간다
      // 확인할 후보 카드는 펼치기 버튼으로 들어간다
      const t = k < 2 ? cellAt(0, k + 1, false) : {x: colX(2, false) + MW[2] - 125, y: MAP_Y - 52, w: 250}, sc = t.w / el._w;
      put(el, t.x, t.y, {s: sc});
      later(750, () => put(el, t.x, t.y, {s: sc, o: 0}));
      return;
    }
    put(el, [298, 762, S2X][k], 648, {o: step === 4 ? 1 : 0, s: step === 4 ? 1 : .96, d: step === 4 ? 200 + k * 200 : 0});
    fs.forEach(f => f.style.width = step === 4 ? f.dataset.w + "%" : 0);
  });

  // 신뢰도 지도: 첫 줄(방금 본 기능)이 먼저, 나머지 줄은 하나씩 채워진다. 확인할 것은 접힌 채로 시작
  mapOpen = false;
  layoutMap(last);

  document.querySelectorAll(".dots button").forEach((b, i) => b.classList.toggle("on", i === step));
  document.getElementById("prev").disabled = step === 0;
  document.getElementById("next").textContent = last ? "처음으로" : "다음";
}

const dots = document.getElementById("dots");
STEPS.forEach((s, i) => {
  const b = document.createElement("button");
  b.textContent = `${i + 1} ${s.dot}`;
  b.onclick = () => go(i);
  dots.appendChild(b);
});
const next = () => go(step === STEPS.length - 1 ? 0 : step + 1);
document.getElementById("prev").onclick = () => go(step - 1);
document.getElementById("next").onclick = next;
document.getElementById("auto").onclick = e => {
  if (autoT) { clearTimeout(autoT); autoT = null; e.target.textContent = "자동 재생"; return; }
  const tick = () => { next(); autoT = setTimeout(tick, HOLD[step]); };
  autoT = setTimeout(tick, HOLD[step]); e.target.textContent = "멈춤";
};
document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); next(); }
  if (e.key === "ArrowLeft") go(step - 1);
  if (e.key === "Escape") hideCard();
});
function fit() { stage.style.transform = `scale(${document.getElementById("frame").clientWidth / W})`; }
addEventListener("resize", fit); fit();
// ?step=3 처럼 주소로 바로 연다
go(Number(new URLSearchParams(location.search).get("step") || 1) - 1);
</script>
</body></html>

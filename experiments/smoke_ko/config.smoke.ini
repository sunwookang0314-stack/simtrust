; SimTrust - Korean smoke test profile.
; ASCII ONLY. TinyTroupe reads config.ini with configparser without an encoding
; argument (utils/config.py), so any non-ASCII byte breaks "import tinytroupe"
; on a Korean Windows locale. Korean notes are in README.md.
;
; This file is the committed one. run_smoke.py copies it to config.ini at start,
; because the repo .gitignore excludes config.ini.
;
; Free profile: requires OPENAI_BASE_URL in the environment.
;   OPENAI_BASE_URL=https://generativelanguage.googleapis.com/v1beta/openai/
;   OPENAI_API_KEY=<key from https://aistudio.google.com/apikey>
; Paid profile: set MODEL=gpt-5-mini and remove OPENAI_BASE_URL.
;
; Note: BASE_URL here has no effect. TinyTroupe reads it into config but never
; passes it to the OpenAI client. Use the OPENAI_BASE_URL env var. See FINDINGS.md.

[OpenAI]
API_TYPE=openai
MODEL=gemini-3.5-flash-lite

; Gemini counts thinking tokens against this limit; a low value returns empty
; content. 8000 was enough for every call in this experiment.
MAX_COMPLETION_TOKENS=8000

; No effect on gpt-5-mini or gemini: openai_client.py sends reasoning_effort
; only when the model name contains "o1" or "o3". Left here as a reminder.
REASONING_EFFORT=low

TIMEOUT=240
MAX_ATTEMPTS=6
WAITING_TIME=5
EXPONENTIAL_BACKOFF_FACTOR=2

; Free tier has a tight per-minute quota.
MAX_CONCURRENT_MODEL_CALLS=1

EMBEDDING_MODEL=text-embedding-3-small

; run_smoke.py turns the cache on per repetition with its own file name,
; so this stays off here.
CACHE_API_CALLS=False

[Simulation]
PARALLEL_AGENT_ACTIONS=True
PARALLEL_AGENT_GENERATION=True
RAI_HARMFUL_CONTENT_PREVENTION=True
RAI_COPYRIGHT_INFRINGEMENT_PREVENTION=True

[Cognition]
ENABLE_MEMORY_CONSOLIDATION=False
ENABLE_CONTINUOUS_CONTEXTUAL_SEMANTIC_MEMORY_RETRIEVAL=False

[ActionGenerator]
ENABLE_QUALITY_CHECKS=False

[Logging]
LOGLEVEL=WARNING
LOG_INCLUDE_THREAD_ID=False

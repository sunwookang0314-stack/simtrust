; SimTrust - Gemini free tier profile (development and debugging only).
; Applied by: python scripts/use_provider.py gemini
;
; ASCII ONLY. See config.openai.ini for why. Korean notes are in README.md.
;
; Rules for this profile:
;   1) Never send human participant data here. Free tier input may be used to
;      improve Google models.
;   2) Numbers produced here never go into the report. Final numbers come from
;      the openai profile only, so the comparison stays single-model.
;   3) Requires these two lines in .env:
;      OPENAI_BASE_URL=https://generativelanguage.googleapis.com/v1beta/openai/
;      OPENAI_API_KEY=<key from https://aistudio.google.com/apikey>

[OpenAI]
API_TYPE=openai
; 2026-11-01: gemini-2.5-flash returns 404 "no longer available to new users"
; for newly issued keys. gemini-3.8-flash is the ID listed by models.list().
MODEL=gemini-3.8-flash

; Higher than the openai profile on purpose: gemini-2.5-flash counts thinking
; tokens against this limit, so a low value returns empty content with
; finish_reason=length. Free tier, so there is no cost risk in raising it.
MAX_COMPLETION_TOKENS=8192

; No-op here as well (see config.openai.ini).
REASONING_EFFORT=low

CACHE_API_CALLS=True
CACHE_FILE_NAME=runs/api_cache_gemini.json

; Free tier has a tight per-minute quota.
MAX_CONCURRENT_MODEL_CALLS=1

TIMEOUT=120
MAX_ATTEMPTS=2
WAITING_TIME=2
EXPONENTIAL_BACKOFF_FACTOR=5

; Deliberately an OpenAI model name. Embeddings are disabled below, so this is
; never called; a Gemini embedding name would fail llama-index validation at
; import time (OpenAIEmbeddingModelType enum).
EMBEDDING_MODEL=text-embedding-3-small

[Cognition]
ENABLE_CONTINUOUS_CONTEXTUAL_SEMANTIC_MEMORY_RETRIEVAL=False
ENABLE_MEMORY_CONSOLIDATION=False

[Simulation]
PARALLEL_AGENT_GENERATION=False
PARALLEL_AGENT_ACTIONS=False

[Logging]
LOGLEVEL=ERROR
LOGLEVEL_CONSOLE=WARNING

; SimTrust - OpenAI (paid) profile.
; Applied by: python scripts/use_provider.py openai
;
; ASCII ONLY. TinyTroupe reads config.ini with configparser and does not pass an
; encoding (utils/config.py:131), so on a Korean Windows locale any non-ASCII byte
; raises UnicodeDecodeError at "import tinytroupe".
; Korean notes live in README.md instead.
;
; Use this profile for every number that goes into the report.

[OpenAI]
API_TYPE=openai
MODEL=gpt-5-mini

; Main cost guard. Upstream default is 128000, which is dangerous.
MAX_COMPLETION_TOKENS=2048

; WARNING: no-op on this model. clients/openai_client.py:459 only sends
; reasoning_effort when "o1" or "o3" appears in the model name. Kept for the day
; a reasoning model is used; cost control here rests on MAX_COMPLETION_TOKENS.
REASONING_EFFORT=low

; Repeated identical calls hit the cache instead of the API.
CACHE_API_CALLS=True
CACHE_FILE_NAME=runs/api_cache_openai.json

MAX_CONCURRENT_MODEL_CALLS=2
TIMEOUT=120
MAX_ATTEMPTS=2
WAITING_TIME=1
EXPONENTIAL_BACKOFF_FACTOR=5

EMBEDDING_MODEL=text-embedding-3-small

[Cognition]
; Semantic memory retrieval calls the embedding endpoint through llama-index,
; which reads OPENAI_API_BASE and ignores OPENAI_BASE_URL. That both adds cost
; here and breaks the gemini profile. Off until we actually need it.
ENABLE_CONTINUOUS_CONTEXTUAL_SEMANTIC_MEMORY_RETRIEVAL=False
ENABLE_MEMORY_CONSOLIDATION=False

[Simulation]
PARALLEL_AGENT_GENERATION=True
PARALLEL_AGENT_ACTIONS=True

[Logging]
LOGLEVEL=ERROR
LOGLEVEL_CONSOLE=WARNING
